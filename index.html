<script>

function seg(ax,ay,bx,by,f,e,kick){

}
function startMulti(){for(const p of pads)p.lit=0;msg='RENDSZER FELTÖRVE! +3000';msgT=150;flash=1;shake=6;fx(180,110,'#ff8a00',30,300);[400,600,800,1000].forEach((f,k)=>setTimeout(()=>snd(f,f*1.6,.15,'sawtooth',.1),k*90));score+=3000*mult;mult=Math.min(mult+1,5);mode=Math.max(mode,600)}

   else{snd(500+Math.random()*300,180,.18,'square',.12);snd(900,1400,.08,'sine',.06)}}

 {const bx=mbx;

 {const rf0={px:180,py:345,w:1.8},cx=Math.cos(ra)*26,cy=Math.sin(ra)*26;
  if(seg(180-cx,345-cy,180+cx,345+cy,rf0,.6,0)&&rc<=0){score+=60*mult;rc=.15;rf=1;snd(330,500,.05,'triangle',.07);fx(ball.x,ball.y,'#4aa8ff',4,110)}}
 for(const p of pads){const inn=Math.hypot(ball.x-p.x,ball.y-p.y)<p.r+R*.3;if(inn&&!p.in){score+=100*mult;p.f=1;p.lit=1;fx(p.x,p.y,'#ffee66',8,120);pop(p.x,p.y-p.r-4,100*mult,'#ffee66');snd(1000,1600,.1,'sine',.09)}p.in=inn}
 if(bl.length===1&&pads.every(p=>p.lit)&&ball.y<560)startMulti();
 for(const q of pegs){const dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy);

   ball.vx+=nx*80;ball.vy+=ny*80;if(q.f<.3){score+=25*mult;snd(800+Math.random()*200,500,.05,'triangle',.06)}q.f=1;fx(q.x,q.y,q.c,4,100)}}

 if(all){score+=2500*mult;mult=Math.min(mult+1,5);msg='SZORZÓ x'+mult;msgT=120;flash=1;shake=6;for(const i of ins)i.lit=0;[500,700,900,1200].forEach((f,k)=>setTimeout(()=>snd(f,f*1.5,.15,'square',.1),k*110))}
 {const sp0=Math.hypot(ball.vx,ball.vy);if(sp0<25&&ball.x<320&&ball.y<520){ball.st=(ball.st||0)+dt;if(ball.st>1){ball.st=0;ball.vy=-260;ball.vx=(Math.random()-.5)*320;snd(250,500,.12,'triangle',.08)}}else ball.st=0}

 {const pa=sa;sa+=spin;spin*=.999;if(Math.floor(sa/PI)!==Math.floor(pa/PI)){score+=25*mult;snd(1500,1200,.03,'square',.04)}}
 const sp=Math.hypot(ball.vx,ball.vy);if(sp>1400){ball.vx*=1400/sp;ball.vy*=1400/sp}
 if(ball.y>670)return 1;return 0
}
function drain(){if(save>0){save=0;msg='LABDAMENTÉS';msgT=120;snd(300,900,.3,'sine',.12);reset();return}{const bn=hits*40*mult;score+=bn;hits=0;if(bn>0){msg='BÓNUSZ +'+bn;msgT=150}}mult=1;mode=0;snd(400,60,.6,'sawtooth',.15);balls--;if(balls<=0){over=true;setTimeout(()=>{snd(300,40,1,'square',.12)},500);if(qual(score)){charging=0;ent={n:lastN.slice(),pos:0,sc:score};btn(1)}}reset()}function launch(){const ch=charge;charge=0;ball=bl[0];

}
function skull(cx,cy,s,glow){
 const g=x.createLinearGradient(cx-s,cy-s,cx+s,cy+s);g.addColorStop(0,'#e8eef5');g.addColorStop(.5,'#8a97a6');g.addColorStop(1,'#3a4452');

 for(const k of[-1,1]){x.beginPath();x.arc(cx+k*s*.35+Math.max(-1,Math.min(1,(ball.x-cx)/120))*s*.07,cy-s*.2+Math.max(-1,Math.min(1,(ball.y-cy)/200))*s*.07,s*(.08+glow*.05+.015*Math.sin(performance.now()/300)),0,7);x.fill()}

const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 let g=b.createLinearGradient(0,0,W,0);g.addColorStop(0,'#0b1d44');g.addColorStop(.5,'#0d0710');g.addColorStop(1,'#46101c');b.fillStyle=g;b.fillRect(0,0,W,H);
 g=b.createRadialGradient(180,90,10,180,90,200);g.addColorStop(0,'rgba(255,42,74,.35)');g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(0,0,W,H);
 g=b.createRadialGradient(180,450,10,180,450,170);g.addColorStop(0,'rgba(74,168,255,.18)');g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(0,0,W,H);

 for(let i=0;i<26;i++){let px=Math.floor(rnd()*12)*30+15,py=Math.floor(rnd()*20)*30+15;b.beginPath();b.moveTo(px,py);

})();

function entKey(e){const c=e.code,n=ent.n;

 x.textAlign='center';
